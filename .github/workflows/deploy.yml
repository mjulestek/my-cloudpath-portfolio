
name: Deploy the actual site Content

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "scripts/deploy-content.sh"
  workflow_dispatch: 

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:

      SITE_BUCKET: ${{ vars.SITE_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sanity check
        run: |
          test -f public/index.html || { echo "public/index.html not found"; exit 1; }
          chmod +x scripts/deploy-content.sh

      - name: Deploy
        run: ./scripts/deploy-content.sh
