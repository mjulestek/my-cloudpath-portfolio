
name: Infra provisioning (Terraform)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to run"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
          - destroy


permissions:
  id-token: write
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/environments/prod
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_INFRA_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Generate Terraform config from repository variables
        run: |
          cat > backend-prod.hcl << EOF
          bucket       = "${{ vars.TF_STATE_BUCKET }}"
          region       = "${{ vars.TF_STATE_REGION }}"
          use_lockfile = true
          EOF
          cat > terraform.tfvars << EOF
          aws_region                = "${{ vars.AWS_REGION }}"
          site_bucket_name          = "${{ vars.SITE_BUCKET }}"
          domain_name               = "${{ vars.SITE_DOMAIN }}"
          subject_alternative_names = ${{ vars.TF_SUBJECT_ALTERNATIVE_NAMES }}
          acm_certificate_arn       = "${{ vars.TF_ACM_CERTIFICATE_ARN }}"
          EOF
          echo "--- Generated backend-prod.hcl ---"
          cat backend-prod.hcl
          echo "--- Generated terraform.tfvars ---"
          cat terraform.tfvars

      - run: terraform init -backend-config=backend-prod.hcl

      - run: terraform fmt -check -recursive

      - run: terraform validate

      - run: terraform plan -input=false -out=tfplan

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/environments/prod/tfplan
          retention-days: 1

  apply:
    needs: plan
    if: ${{ github.event.inputs.action == 'apply' }}
    runs-on: ubuntu-latest
    environment: production 
    defaults:
      run:
        working-directory: terraform/environments/prod
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_INFRA_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform/environments/prod

      - name: Generate Terraform config from repository variables
        run: |
          cat > backend-prod.hcl << EOF
          bucket       = "${{ vars.TF_STATE_BUCKET }}"
          region       = "${{ vars.TF_STATE_REGION }}"
          use_lockfile = true
          EOF
          cat > terraform.tfvars << EOF
          aws_region                = "${{ vars.AWS_REGION }}"
          site_bucket_name          = "${{ vars.SITE_BUCKET }}"
          domain_name               = "${{ vars.SITE_DOMAIN }}"
          subject_alternative_names = ${{ vars.TF_SUBJECT_ALTERNATIVE_NAMES }}
          acm_certificate_arn       = "${{ vars.TF_ACM_CERTIFICATE_ARN }}"
          EOF
          echo "--- Generated backend-prod.hcl ---"
          cat backend-prod.hcl
          echo "--- Generated terraform.tfvars ---"
          cat terraform.tfvars


      - run: terraform init -backend-config=backend-prod.hcl

      - run: terraform apply -input=false tfplan

  destroy:
    needs: plan
    if: ${{ github.event.inputs.action == 'destroy' }}
    runs-on: ubuntu-latest
    environment: production # same approval gate as apply
    defaults:
      run:
        working-directory: terraform/environments/prod
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_INFRA_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Generate Terraform config from repository variables
        run: |
          cat > backend-prod.hcl << EOF
          bucket       = "${{ vars.TF_STATE_BUCKET }}"
          region       = "${{ vars.TF_STATE_REGION }}"
          use_lockfile = true
          EOF
          cat > terraform.tfvars << EOF
          aws_region                = "${{ vars.AWS_REGION }}"
          site_bucket_name          = "${{ vars.SITE_BUCKET }}"
          domain_name               = "${{ vars.SITE_DOMAIN }}"
          subject_alternative_names = ${{ vars.TF_SUBJECT_ALTERNATIVE_NAMES }}
          acm_certificate_arn       = "${{ vars.TF_ACM_CERTIFICATE_ARN }}"
          EOF
          echo "--- Generated backend-prod.hcl ---"
          cat backend-prod.hcl
          echo "--- Generated terraform.tfvars ---"
          cat terraform.tfvars

      - run: terraform init -backend-config=backend-prod.hcl

      - run: terraform destroy -input=false -auto-approve
